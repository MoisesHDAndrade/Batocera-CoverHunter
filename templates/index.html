<title>Game Hunter</title>
<style>
    *{
        font-family: "Poppins", serif;
    }
    
    .card-save{
        top:100%;
        z-index:999;
        transition: transform 0.3s ease;
    }
    .card-scraped:hover .card-save{
        top:50%;
        transition: transform 0.3s ease;
        
    }
    .card-scraped:hover .card-img-overlay{
       background-color: rgba(0,0,0, 0.4);
       transition: transform 0.3s ease;
    }
    
    .card{
        border-radius: .8rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Sombra padrão */
        transition: box-shadow 0.3s ease, transform 0.3s ease; /* Transição suave */

    }
    .card img{
        transition: .5s ease all;
    }
    
    .card:hover{
        box-shadow: 0 0 50px 10px rgba(13, 110, 253, 0.4); /* Sombra difusa com desfoque alto */
        transform: scale(1.05); /* Pequeno zoom para dar mais impacto */
    }
    .card:hover img{
        transform: scale(1.1);
        transition: .5s ease all;
    }
</style>
</head>
